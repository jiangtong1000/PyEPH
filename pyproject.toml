[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeph"
version = "0.1.0.dev1"
description = "Modular electron-nuclear dynamics and charge transport"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = ["jax>=0.6.2", "numpy>=2", "scipy>=1.13", "h5py>=3.11"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11", "build>=1"]
torch = ["torch>=2.4"]
mpi = ["mpi4py>=4"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
