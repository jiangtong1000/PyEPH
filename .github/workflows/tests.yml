name: scientific-validation
on: [push, pull_request]
jobs:
  installed-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            stack: minimum
          - python: '3.12'
            stack: current
          - python: '3.13'
            stack: current
    env:
      JAX_ENABLE_X64: '1'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install numerical dependencies
        run: |
          python -m pip install build ruff
          if [ '${{ matrix.stack }}' = minimum ]; then
            python -m pip install -r requirements-minimum.txt
          else
            python -m pip install 'jax>=0.6.2' 'numpy>=2' 'scipy>=1.13' 'h5py>=3.11' 'pytest>=8'
          fi
      - run: python -m ruff check src tests tools examples benchmarks
      - name: Audit and export publication inventory
        run: |
          python tools/release.py audit --git --ref HEAD
          python tools/release.py export --destination "$RUNNER_TEMP/source-export"
      - name: Build and install exported distribution
        run: |
          python -m build --outdir "$RUNNER_TEMP/distribution" "$RUNNER_TEMP/source-export"
          python -m pip install --no-deps "$RUNNER_TEMP"/distribution/*.whl
      - name: Test the installed wheel outside the source checkout
        run: |
          python tools/qualify_distribution.py --sdist "$RUNNER_TEMP"/distribution/*.tar.gz --wheel "$RUNNER_TEMP"/distribution/*.whl --destination "$RUNNER_TEMP/qualification"
      - name: Retain qualification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-${{ matrix.python }}-${{ matrix.stack }}
          path: |
            ${{ runner.temp }}/qualification/qualification*.json
            ${{ runner.temp }}/qualification/pytest.log
            ${{ runner.temp }}/distribution/*
  optional-torch:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: '1'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,torch]'
      - run: python -m pytest tests/test_torch_adapter.py tests/test_torch_reference.py tests/test_torch_local*.py tests/test_ehrenfest_preparation.py tests/test_mixed_composition.py tests/test_provenance.py
